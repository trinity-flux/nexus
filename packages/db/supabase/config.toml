project_id = "trinity-nexus"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
# Catches outgoing mail locally so sign-up and recovery flows can be tested
# without sending anything to a real address.
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "https://trinity-flux.github.io/trinitynexus.github.io/",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.external.discord]
# The community already lives on Discord, so this is the sign-in path most
# members will take. Secrets come from the environment; nothing is committed.
enabled = true
client_id = "env(SUPABASE_AUTH_DISCORD_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_DISCORD_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"

[storage]
enabled = true
file_size_limit = "2MiB"
