name: Deploy to GitHub Pages

# Every push to main is a release. Pull requests run the same checks but stop
# before deploying, so a branch is verified by the pipeline that will publish it
# rather than by a weaker one.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and a newer commit does not cancel a running one:
# cancelling mid-deploy is how a site ends up serving half of two releases.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        # Version comes from `packageManager` in package.json, so CI and a
        # developer's machine cannot drift apart.

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        # `--frozen-lockfile` fails rather than silently resolving a different
        # tree than the one that was reviewed.
        run: pnpm install --frozen-lockfile

      - name: Verify and build
        env:
          # All public by definition: anything prefixed VITE_ is compiled into
          # the bundle a visitor downloads.
          VITE_BASE_PATH: /nexus/
          VITE_SITE_URL: https://trinity-flux.github.io
          # Repository *variables*, not secrets. The anon key is published in
          # the bundle either way, and marking it secret would only mask it in
          # the build log while implying it protects something — it does not.
          # Row Level Security is what authorises a request.
          #
          # The service_role key must never be set here, as a variable or a
          # secret: it bypasses every policy.
          #
          # Defaulting to `memory` means the switch to the real backend happens
          # entirely in Settings → Variables, with no commit, and a deployment
          # keeps working until the variables are actually set.
          VITE_DATA_SOURCE: ${{ vars.DATA_SOURCE || 'memory' }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: pnpm run ci

      - name: Upload the built site
        # Only on a push: a pull request has proved the build works, and there
        # is nothing to publish until it lands.
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    name: Publish
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      # Scoped to this job rather than the workflow: the job that runs the
      # repository's own test suite has no business holding a token that can
      # publish.
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
